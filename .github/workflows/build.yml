name: Build JellyWallpaper

# 触发：推送到 main、打 tag (v*)、或手动触发
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest   # 自带 Windows SDK(fxc)、.NET SDK、VS 生成工具
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/JellyWallpaper/JellyWallpaper.csproj

      # 编译 HLSL 着色器并打包成单文件自包含 EXE（Win10 x64，双击即可运行）
      - name: Publish (single-file, self-contained)
        run: >
          dotnet publish src/JellyWallpaper/JellyWallpaper.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: List artifacts
        run: dir publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JellyWallpaper-win-x64
          path: publish/JellyWallpaper.exe

      # 打 tag 时自动创建 GitHub Release 并附带 EXE
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/JellyWallpaper.exe
          generate_release_notes: true
